replicaCount: 1

image:
  repository: weerapatx/hello-go-api
  tag: develop-996da53
  pullPolicy: IfNotPresent

container:
  name: hello-api
  port: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  metrics:
    cpu:
      enabled: true
      averageUtilization: 50
    memory:
      enabled: true
      averageUtilization: 70 