name: Build and Push Docker Image
  
on:
  push:
    branches:
      - develop
      - main  

env:
  helm_path: "helm/microservices/golang-api"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      short_commit: ${{ steps.get_commit.outputs.short_commit }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract short commit hash
        run: echo "short_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY }}:${{ env.SHORT_COMMIT }}
      
  commit-to-another-repo:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      SHORT_COMMIT: ${{ needs.build-and-push.outputs.short_commit }}
    steps:
      - name: Clone Target Repository
        run: |
          git clone https://x-access-token:${{ secrets.GITACTIONS }}@github.com/sudo-yama/devops-assignment-cd.git
          ls -R

      - name: Configure Git user   
        run: |
          cd devops-assignment-cd
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update image tag
        run: |
          cd devops-assignment-cd
          git checkout develop
          cd ${{ env.helm_path }}
          yq -i ".image.tag = \"${SHORT_COMMIT}\"" values-dev.yaml
          git add values-dev.yaml
          git commit -m "Auto update image tag to ${SHORT_COMMIT} from CI" || echo "No changes to commit"
          git push origin develop